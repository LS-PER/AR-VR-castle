<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hrad - Univerzální kamera</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
        }
        /* Video musí být absolutně přes celou obrazovku a nahoře */
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        /* Canvas s 3D grafikou je nad videem, ale propouští kliknutí skrz */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        #ui {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        button {
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #info {
            position: fixed;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Namiřte telefon z okna a zapněte kameru</div>
    
    <video id="video-background" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div id="ui">
        <button id="start-btn">Zapnout kameru</button>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let camera, scene, renderer;
        let cube;
        let videoElement;

        const startBtn = document.getElementById('start-btn');
        const infoDiv = document.getElementById('info');

        startBtn.addEventListener('click', async () => {
            try {
                videoElement = document.getElementById('video-background');
                infoDiv.innerText = 'Spouštím kameru...';

                // Univerzálnější požadavek na zadní kameru
                const constraints = {
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                videoElement.srcObject = stream;
                
                // Důležité: počkáme, až se video reálně začne přehrávat, aby se vykresčilo
                await videoElement.play();

                startBtn.style.display = 'none';
                infoDiv.innerText = 'Kamera aktivní: 5m kvádr před vámi';

                initThree();

            } catch (error) {
                alert('Chyba kamery: ' + error.message);
                infoDiv.innerText = 'Chyba: ' + error.message;
                console.error(error);
            }
        });

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Důležité: alpha: true zajistí průhlednost pozadí canvasu, aby prosvítalo video
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            const geometry = new THREE.BoxGeometry(5, 5, 5);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xd4af37,
                roughness: 0.4,
                metalness: 0.6,
                transparent: true,
                opacity: 0.85
            });

            cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 0, -10);
            scene.add(cube);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (cube) {
                cube.rotation.y += 0.005;
                cube.rotation.x += 0.002;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
