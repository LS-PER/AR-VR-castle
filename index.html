<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hrad - Pokročilá Georeference</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
        }
        #camera-stream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        #ui {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        #commit-badge {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            padding: 4px 10px;
            border-radius: 10px;
        }
        button {
            background-color: #3b82f6; 
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #info {
            position: fixed;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            font-size: 13px;
            z-index: 10;
            pointer-events: none;
            background: rgba(0,0,0,0.6);
            padding: 8px;
        }
        /* Ovládací panel pro korekci pozice v terénu */
        #controls-panel {
            position: fixed;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .ctrl-btn {
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 1px solid #3b82f6;
            padding: 10px;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="info">Inicializace AR...</div>
    
    <video id="camera-stream" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div id="controls-panel" style="display:none;">
        <button class="ctrl-btn" id="btn-up">Výška +2m</button>
        <button class="ctrl-btn" id="btn-down">Výška -2m</button>
        <button class="ctrl-btn" id="btn-near">Bližše 5m</button>
        <button class="ctrl-btn" id="btn-far">Dále 5m</button>
    </div>

    <div id="ui">
        <div id="commit-badge">v3.0 - Pokročilá Georeference & Gyro</div><br>
        <button id="start-btn">Spustit AR Kalibraci</button>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let camera, scene, renderer;
        let arObject = null;
        let videoElement;
        let userPos = null;
        let manualYOffset = 0; // Ruční úprava výšky
        let manualDistOffset = 0; // Ruční úprava vzdálenosti

        // Cílové GPS souřadnice
        const targetGPS = {
            lat: 49.8823061,
            lon: 14.4123647
        };

        const startBtn = document.getElementById('start-btn');
        const infoDiv = document.getElementById('info');
        const ctrlPanel = document.getElementById('controls-panel');

        startBtn.addEventListener('click', async () => {
            try {
                infoDiv.innerText = 'Spouštím kameru...';

                videoElement = document.getElementById('camera-stream');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();

                infoDiv.innerText = 'Čekám na GPS...';

                // Orientace zařízení v prostoru
                window.addEventListener('deviceorientation', onDeviceOrientation, true);

                if (!navigator.geolocation) {
                    alert('Geolokace není podporována.');
                    return;
                }

                navigator.geolocation.watchPosition(
                    (position) => {
                        userPos = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        };
                        updateGeoreference();
                    },
                    (err) => { infoDiv.innerText = 'Chyba GPS: ' + err.message; },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
                );

                startBtn.style.display = 'none';
                document.getElementById('commit-badge').style.display = 'none';
                ctrlPanel.style.display = 'flex';
                initThree();

            } catch (error) {
                alert('Chyba: ' + error.message);
            }
        });

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            // Nastavíme zorný úhel (FOV 60°) blízko typickým mobilním čočkám
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
            scene.add(light);

            // Modrý objekt 2x2x2 metry (50% průhlednost)
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x3b82f6,
                emissive: 0x1d4ed8,
                emissiveIntensity: 0.6,
                transparent: true,
                opacity: 0.5
            });

            arObject = new THREE.Mesh(geometry, material);
            scene.add(arObject);
            arObject.visible = false;

            // Ovládání tlačítky pro jemné doladění na místě
            document.getElementById('btn-up').onclick = () => { manualYOffset += 2; updateGeoreference(); };
            document.getElementById('btn-down').onclick = () => { manualYOffset -= 2; updateGeoreference(); };
            document.getElementById('btn-near').onclick = () => { manualDistOffset -= 5; updateGeoreference(); };
            document.getElementById('btn-far').onclick = () => { manualDistOffset += 5; updateGeoreference(); };

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // Orientace kamery Three.js podle gyroskopu telefonu
        function onDeviceOrientation(event) {
            if (!event.alpha && !event.beta && !event.gamma) return;
            
            const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
            const beta = THREE.MathUtils.degToRad(event.beta || 0);
            const gamma = THREE.MathUtils.degToRad(event.gamma || 0);

            const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        // Přesný georeferenční přepočet WGS84 -> Metrický prostor
        function updateGeoreference() {
            if (!userPos || !arObject) return;

            const lat1 = userPos.lat * Math.PI / 180;
            const lat2 = targetGPS.lat * Math.PI / 180;
            const dLat = (targetGPS.lat - userPos.lat) * Math.PI / 180;
            const dLon = (targetGPS.lon - userPos.lon) * Math.PI / 180;

            const R = 6378137; // Equatorial radius
            const x = dLon * Math.cos((lat1 + lat2) / 2) * R; 
            const z = dLat * R; 

            // Aplikace pozice v metrech + ruční korekce výšky/vzdálenosti
            const finalX = x;
            const finalZ = -z + manualDistOffset;
            const finalY = manualYOffset;

            arObject.position.set(finalX, finalY, finalZ);
            arObject.visible = true;

            const dist = Math.sqrt(x*x + z*z).toFixed(1);
            infoDiv.innerText = `Vzdálenost: ${dist}m | Y-offset: ${manualYOffset}m`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
