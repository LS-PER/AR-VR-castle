<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hrad - GPS + Kompas & Šipka</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
        }
        #camera-stream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        #ui {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        button {
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #info {
            position: fixed;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            background: rgba(0,0,0,0.6);
            padding: 10px;
        }
        /* Styl pro navigační šipku */
        #radar-hud {
            position: fixed;
            top: 80px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        #nav-arrow {
            display: inline-block;
            font-size: 40px;
            color: #ffd700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body>
    <div id="info">Čekám na GPS, kompas a spuštění...</div>
    
    <!-- Navigační šipka ukazující směr ke kvádru -->
    <div id="radar-hud">
        <div id="nav-arrow">⬆️</div>
    </div>

    <video id="camera-stream" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div id="ui">
        <button id="start-btn">Spustit AR navigaci</button>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let camera, scene, renderer;
        let cube;
        let videoElement;
        let userPos = null;
        let heading = 0; // Natočení telefonu (kompas)

        // Cílové GPS souřadnice
        const targetGPS = {
            lat: 49.8823061,
            lon: 14.4123647,
            alt: 250
        };

        const startBtn = document.getElementById('start-btn');
        const infoDiv = document.getElementById('info');
        const navArrow = document.getElementById('nav-arrow');

        startBtn.addEventListener('click', async () => {
            try {
                infoDiv.innerText = 'Spouštím senzory a kameru...';

                // 1. Vyžádání oprávnění pro kompas na iOS (pokud je potřeba) i Android
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    await DeviceOrientationEvent.requestPermission();
                }

                // 2. Sledování kompasu (DeviceOrientation)
                window.addEventListener('deviceorientation', (event) => {
                    if (event.webkitCompassHeading !== undefined) {
                        // iOS Safari
                        heading = event.webkitCompassHeading;
                    } else if (event.alpha !== undefined) {
                        // Android Chrome (alpha vrací otočení kompasu)
                        heading = 360 - event.alpha;
                    }
                    updateNavigation();
                }, true);

                // 3. Spuštění zadní kamery
                videoElement = document.getElementById('camera-stream');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();

                // 4. Sledování GPS polohy
                if (!navigator.geolocation) {
                    alert('Geolokace není podporována.');
                    return;
                }

                navigator.geolocation.watchPosition(
                    (position) => {
                        userPos = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude,
                            alt: position.coords.altitude || 250
                        };
                        updateNavigation();
                    },
                    (error) => {
                        infoDiv.innerText = 'Chyba GPS: ' + error.message;
                    },
                    { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 }
                );

                startBtn.style.display = 'none';
                initThree();

            } catch (error) {
                alert('Chyba: ' + error.message);
                console.error(error);
            }
        });

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 10000);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Vytvoření velkého svítícího 8m kvádru
            const geometry = new THREE.BoxGeometry(8, 8, 8);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xffd700,
                emissive: 0xffaa00,      // Svítí sama od sebe
                emissiveIntensity: 1.0,
                roughness: 0.1,
                metalness: 0.9,
                transparent: true,
                opacity: 0.95
            });

            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
