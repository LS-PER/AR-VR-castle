<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobilní Kamera</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
        }
        /* Video přes celou obrazovku */
        #camera-stream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        #ui {
            position: fixed;
            bottom: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        button {
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #info {
            position: fixed;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            font-size: 16px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Klikněte na tlačítko pro zapnutí kamery</div>
    
    <!-- Element pro živý obraz z kamery -->
    <video id="camera-stream" autoplay playsinline muted></video>

    <div id="ui">
        <button id="start-btn">Zapnout kameru</button>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const videoElement = document.getElementById('camera-stream');
        const infoDiv = document.getElementById('info');

        startBtn.addEventListener('click', async () => {
            try {
                infoDiv.innerText = 'Zapínám kameru...';
                
                // Požadavek na zadní kameru
                const constraints = {
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = stream;
                await videoElement.play();

                // Skryjeme tlačítko a aktualizujeme text
                startBtn.style.display = 'none';
                infoDiv.innerText = 'Kamera aktivní';
            } catch (error) {
                alert('Chyba kamery: ' + error.message);
                infoDiv.innerText = 'Chyba: ' + error.message;
                console.error(error);
            }
        });
    </script>
</body>
</html>
