<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hrad - GPS Georeferencing</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
        }
        #camera-stream {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        #ui {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        button {
            background-color: #d4af37;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #info {
            position: fixed;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="info">Čekám na GPS a spuštění...</div>
    
    <video id="camera-stream" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <div id="ui">
        <button id="start-btn">Spustit AR s GPS</button>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let camera, scene, renderer;
        let cube;
        let videoElement;
        let userPos = null;

        // Správné cílové GPS souřadnice
        const targetGPS = {
            lat: 49.8823061,
            lon: 14.4123647,
            alt: 250      // Odhadovaná nadmořská výška v metrech
        };

        const startBtn = document.getElementById('start-btn');
        const infoDiv = document.getElementById('info');

        startBtn.addEventListener('click', async () => {
            try {
                infoDiv.innerText = 'Zajišťuji GPS a kameru...';

                // 1. Spuštění zadní kamery
                videoElement = document.getElementById('camera-stream');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();

                // 2. Sledování GPS polohy uživatele
                if (!navigator.geolocation) {
                    alert('Geolokace není v tomto prohlížeči podporována.');
                    return;
                }

                navigator.geolocation.watchPosition(
                    (position) => {
                        userPos = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude,
                            alt: position.coords.altitude || 250
                        };
                        updateObjectPosition();
                    },
                    (error) => {
                        infoDiv.innerText = 'Chyba GPS: ' + error.message;
                    },
                    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
                );

                startBtn.style.display = 'none';
                initThree();

            } catch (error) {
                alert('Chyba: ' + error.message);
                console.error(error);
            }
        });

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 10000);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Vytvoření 5x5x5 metrového kvádru
            const geometry = new THREE.BoxGeometry(5, 5, 5);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xd4af37,
                roughness: 0.4,
                metalness: 0.6,
                transparent: true,
                opacity: 0.85
            });

            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            cube.visible = false; 

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function updateObjectPosition() {
            if (!userPos || !cube) return;

            const R = 6371000; 
            const dLat = (targetGPS.lat - userPos.lat) * Math.PI / 180;
            const dLon = (targetGPS.lon - userPos.lon) * Math.PI / 180;
            
            const lat1 = userPos.lat * Math.PI / 180;
            const lat2 = targetGPS.lat * Math.PI / 180;

            const x = dLon * Math.cos((lat1 + lat2) / 2) * R; 
            const z = dLat * R; 
            const y = targetGPS.alt - userPos.alt; 

            cube.position.set(x, y, -z);
            cube.visible = true;

            const dist = Math.sqrt(x*x + z*z).toFixed(1);
            infoDiv.innerText = `Cíl vzdálen: ${dist} m | X:${x.toFixed(1)} Z:${z.toFixed(1)}`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (cube) {
                cube.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
